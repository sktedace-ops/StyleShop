server:
  port: 8081
spring:
  application.name: auth-service
  datasource:
    url: jdbc:mysql://${DB_HOST:localhost}:${DB_PORT:3306}/${DB_NAME:styleshop_auth}?createDatabaseIfNotExist=true&useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=Asia/Taipei&characterEncoding=UTF-8
    username: ${DB_USER:root}
    password: ${DB_PASSWORD:1234}
  jpa:
    hibernate.ddl-auto: update
    open-in-view: false
styleshop.jwt:
  issuer: styleshop-auth
  expires-in-seconds: 1800
