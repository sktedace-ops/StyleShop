spring.application.name=vscode-shop
spring.datasource.url=jdbc:mysql://localhost:3306/company_shop?createDatabaseIfNotExist=true&useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=Asia/Taipei&characterEncoding=UTF-8
spring.datasource.username=${DB_USERNAME:root}
spring.datasource.password=${DB_PASSWORD}
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
server.port=8080

# MyBatis XML Mapper 設定
mybatis.mapper-locations=classpath:mappers/*.xml
mybatis.type-aliases-package=com.example.vscodeshop.model
mybatis.configuration.map-underscore-to-camel-case=true
