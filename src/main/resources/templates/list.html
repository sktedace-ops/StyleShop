<!DOCTYPE html><html lang="zh-TW"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>StyleShop 商品商城</title><link rel="stylesheet" href="/css/style.css"></head><body>
<header class="shop-header"><a href="/" class="brand"><span class="brand-icon">♧</span><span><b>StyleShop</b><small>Wear Your Story</small></span></a><div class="shop-actions"><a href="/cart" class="header-link">🛒 購物車</a><a href="/orders" class="header-link">▣ 我的訂單</a><a th:if="${session.loginUser == null}" href="/login-page" class="header-link">♙ 登入</a><a th:if="${session.loginUser != null}" href="/logout" class="header-link">↪ 登出</a></div></header>
<nav class="shop-nav"><div class="nav-categories"><button class="nav-filter active" data-category="">首頁</button><button class="nav-filter" data-name="衣服">衣服</button><button class="nav-filter" data-name="鞋子">鞋子</button><button class="nav-filter" data-name="帽子">帽子</button><button class="nav-filter" data-name="包包">包包</button></div><div th:if="${session.loginRole == 'ADMIN'}"><a href="/admin/products" class="header-link">商品管理</a><a href="/admin/categories" class="header-link">種類管理</a><a href="/admin/products/register" class="header-link">登記商品</a><a href="/admin/products/remove" class="header-link">移除商品</a></div></nav>
<main class="store-main"><section class="hero-banner"><div class="hero-copy"><h1>精選服飾</h1><p>簡約・舒適・展現自我風格</p><small>SIMPLE ・ COMFORTABLE ・ BE YOURSELF</small></div></section>
<section class="category-shortcuts"><button class="category-tile active" data-category=""><span>⌂</span>全部商品</button><button class="category-tile" data-name="衣服"><span>👕</span>衣服</button><button class="category-tile" data-name="鞋子"><span>👟</span>鞋子</button><button class="category-tile" data-name="帽子"><span>🧢</span>帽子</button><button class="category-tile" data-name="包包"><span>🎒</span>包包</button></section>
<div class="catalog-heading"><div><h2 id="catalogTitle">全部商品</h2><p>每頁最多顯示 9 項商品</p></div><select id="categorySelect"><option value="">全部商品</option></select></div><div id="productList" class="product-grid modern-grid"></div><div id="pagination" class="pagination"></div></main>
<script>
const categorySelect=document.getElementById("categorySelect"),productList=document.getElementById("productList"),pagination=document.getElementById("pagination"),catalogTitle=document.getElementById("catalogTitle");let allProducts=[],currentPage=1,categories=[];const pageSize=9;
fetch("/api/categories").then(r=>r.json()).then(data=>{categories=data;data.forEach(c=>{const o=document.createElement("option");o.value=c.id;o.textContent=c.name;categorySelect.appendChild(o)});bindCategoryButtons()});
function bindCategoryButtons(){document.querySelectorAll("[data-name],[data-category]").forEach(btn=>btn.onclick=()=>{let value=btn.dataset.category??"";if(btn.dataset.name){const c=categories.find(x=>x.name===btn.dataset.name);value=c?String(c.id):""}categorySelect.value=value;document.querySelectorAll(".category-tile,.nav-filter").forEach(x=>x.classList.remove("active"));btn.classList.add("active");loadProducts()})}
function loadProducts(){const id=categorySelect.value;fetch(id?`/api/products?categoryId=${id}`:"/api/products").then(r=>r.json()).then(data=>{allProducts=data;currentPage=1;catalogTitle.textContent=id?categorySelect.options[categorySelect.selectedIndex].text+" 商品":"全部商品";renderProducts()})}
function renderProducts(){productList.innerHTML="";const start=(currentPage-1)*pageSize;allProducts.slice(start,start+pageSize).forEach(p=>{const card=document.createElement("article");card.className="product-card modern-card";card.innerHTML=`<a href="/product/${p.id}" class="product-photo-link"><img src="${p.imageUrl||'/images/no-image.svg'}" alt="${p.name}" class="product-image"></a><div class="product-card-body"><span class="category-badge">${p.categoryName}</span><h3>${p.name}</h3><p class="price">NT$ ${Number(p.price).toLocaleString()}</p><a href="/product/${p.id}" class="product-link">查看商品 / 加入購物車</a></div>`;productList.appendChild(card)});if(!allProducts.length)productList.innerHTML="<p>目前這個種類沒有商品。</p>";renderPagination()}
function renderPagination(){pagination.innerHTML="";const total=Math.ceil(allProducts.length/pageSize);if(total<=1)return;const make=(text,page,disabled=false,active=false)=>{const b=document.createElement("button");b.textContent=text;b.disabled=disabled;if(active)b.classList.add("active");b.onclick=()=>{currentPage=page;renderProducts();window.scrollTo({top:450,behavior:"smooth"})};pagination.appendChild(b)};make("上一頁",currentPage-1,currentPage===1);for(let i=1;i<=total;i++)make(i,i,false,i===currentPage);make("下一頁",currentPage+1,currentPage===total)}
categorySelect.onchange=loadProducts;loadProducts();
</script></body></html>
